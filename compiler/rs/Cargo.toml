[workspace]
resolver = "2"

members = [
    "crates/kanagawa_parsetree_sys",
    "crates/kanagawa_parsetree",
    "crates/kanagawa_driver",
    "crates/kanagawa_syntax",
    "crates/kanagawa_ast",
    "crates/kanagawa_hir",
    "crates/kanagawa_typeck",
    "crates/kanagawa_resolve",
    "crates/kanagawa_sema",
    "crates/kanagawa_codegen",
]

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"

# FFI / codegen
bindgen = "0.71"
cc = "1"

# Parsing stack (not used yet; reserved for next milestones)
logos = "0.15"
rowan = "0.16"

# Utilities
once_cell = "1"
